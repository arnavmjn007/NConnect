spring.application.name=core-service

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

feed.service.url=${FEED_SERVICE_URL}
feed.service.internal-secret=${INTERNAL_SECRET}

ai.service.url=${AI_SERVICE_URL}

server.port=${PORT:8080}